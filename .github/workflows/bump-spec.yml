name: bump-spec
# Adopt a new AITP spec revision. Dispatched by the spec repo
# (`spec-released`) on a conformance-relevant push; also runnable by hand.
# The spec SHA lives in SPEC_VERSION, so bump-spec-ref runs in file mode,
# and its post-bump step (scripts/post-spec-bump.sh) regenerates
# testdata/spec, errors.go and the adapter test transcript from the new pin
# so the PR is complete. The PR is HELD, never auto-merged:
# adopting a spec is a reviewed change, and the PR's CI re-runs
# conformance against the new fixtures.
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Spec SHA (blank = event payload / spec HEAD)'
        required: false
        default: ''
jobs:
  bump:
    uses: agentidentitytrustprotocol/aitp-ci/.github/workflows/bump-spec-ref.yml@8d2c1aea7c97ddc14ad0e8e2e30457228838572e # v1
    with:
      mode: file
      file: SPEC_VERSION
      sha: ${{ github.event.inputs.sha }}
      # Runs at the repo root after SPEC_VERSION is rewritten, with the
      # runner's preinstalled go, cargo and python3. go.mod's `go 1.26` line
      # fetches a new enough Go toolchain if the runner's is older.
      post-bump: scripts/post-spec-bump.sh
    secrets: inherit
